<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EOTA Announcer Stats</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D2418">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Live stats for the Eagles on the Air play-by-play and color announcers. Read-only: it listens to the
  same eota-stat-keeper game the stat crew enters plays into (graphics/basketball-stats.html), so it
  updates the moment a play is recorded. Built for a phone first, works on a laptop.

  Tabs: Talk (ready-to-read lines: score, runs, leaders, shooting, quarters, foul trouble, milestones),
  Players (each player's line as a sentence and raw numbers), Team (side by side), Plays (the log with
  the running score). ?api=http://localhost:8787 points it at a local copy of the worker.
-->
<style>
  :root {
    --pine: #0D2418; --field: #17402B; --turf: #1E5638; --line: #2C6A46;
    --gold: #D9A521; --gold-hi: #F2C14E; --chalk: #F3EFE2; --chalk-dim: #B9C6B4; --tally: #E5352B; --ok: #5FC48A;
    --font-display: 'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif;
    --font-body: 'Barlow', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--pine); color: var(--chalk); font-family: var(--font-body); font-size: 17px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
  button { font: 600 15px var(--font-body); color: var(--chalk); background: var(--turf); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; min-height: 42px; }
  button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 1px; }

  /* Score header: always in view */
  .top { position: sticky; top: 0; z-index: 5; background: var(--pine); border-bottom: 1px solid var(--line); padding: 8px 14px 8px; padding-top: max(8px, env(safe-area-inset-top)); }
  .wrap { max-width: 980px; margin: 0 auto; }
  .sb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .tm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tm.R { flex-direction: row-reverse; text-align: right; }
  .chip { flex: none; width: 10px; align-self: stretch; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.45); }
  .tm .nm { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm .nm .short { display: none; }
  @media (max-width: 640px) { .tm .nm .full { display: none; } .tm .nm .short { display: inline; } }
  .tm .sub { font-size: 13px; color: var(--chalk-dim); white-space: nowrap; }
  .tm .sub b.bonus { color: var(--gold-hi); }
  .tm .meta { min-width: 0; }
  .mid { text-align: center; }
  .score { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .per { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--chalk-dim); text-transform: uppercase; }
  .conn { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--tally); margin-right: 5px; vertical-align: 1px; }
  .conn.ok { background: var(--ok); }
  .last { margin-top: 6px; font-size: 14px; color: var(--chalk-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; border-radius: 6px; padding: 2px 6px; }
  .last b { color: var(--chalk); }
  .last.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: rgba(242,193,78,.35); } 100% { background: transparent; } }
  .tabs { display: flex; gap: 6px; margin-top: 8px; }
  .tabs button { flex: 1; min-height: 38px; padding: 4px 6px; }
  .tabs button.on { background: var(--gold); color: var(--pine); border-color: var(--gold); }

  main { max-width: 980px; margin: 0 auto; padding: 12px 14px 60px; }
  .warn { color: var(--gold-hi); font-size: 15px; }
  .card { background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 17px; color: var(--gold); margin: 0 0 6px; }
  .say { list-style: none; margin: 0; padding: 0; }
  .say li { padding: 7px 0; border-top: 1px solid rgba(243,239,226,.1); font-size: 18px; }
  .say li:first-child { border-top: 0; }
  .say li small { display: block; font-size: 13px; color: var(--chalk-dim); }
  .say .big { font-size: 21px; font-weight: 700; }
  .say .hot { color: var(--gold-hi); font-weight: 700; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.45); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }

  /* Players */
  .pl { padding: 9px 0; border-top: 1px solid rgba(243,239,226,.1); }
  .pl:first-of-type { border-top: 0; }
  .pl .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .pl .who b { font-size: 19px; }
  .pl .who span { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
  .pl .line { font-size: 16px; }
  .pl .raw { font-size: 13px; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
  .pl .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-left: 6px; background: rgba(229,53,43,.25); color: #ffb3ad; vertical-align: 2px; }
  .pl .tag.dd { background: rgba(242,193,78,.2); color: var(--gold-hi); }
  .pl.dnp { color: var(--chalk-dim); }

  /* Team comparison */
  table.cmp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.cmp td { padding: 7px 4px; border-top: 1px solid rgba(243,239,226,.1); font-size: 17px; }
  table.cmp tr:first-child td { border-top: 0; }
  table.cmp td:first-child { text-align: left; font-weight: 700; }
  table.cmp td:last-child { text-align: right; font-weight: 700; }
  table.cmp td.lbl { text-align: center; font-size: 13px; letter-spacing: .08em; color: var(--chalk-dim); text-transform: uppercase; width: 34%; }
  table.cmp tr.head td { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: .05em; text-transform: uppercase; color: var(--gold); padding-bottom: 10px; vertical-align: bottom; }
  table.cmp tr.head td.vs { font-size: 15px; color: var(--chalk-dim); letter-spacing: .12em; }
  table.cmp tr:nth-child(2) td { border-top: 0; }
  table.cmp small { font-size: 13px; color: var(--chalk-dim); font-weight: 600; }
  .bar { display: flex; height: 5px; margin-top: 3px; background: rgba(243,239,226,.1); border-radius: 3px; overflow: hidden; }
  table.qs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; text-align: center; }
  table.qs th, table.qs td { padding: 6px 4px; border-top: 1px solid rgba(243,239,226,.1); }
  table.qs th { font-size: 12px; color: var(--chalk-dim); border-top: 0; letter-spacing: .08em; }
  table.qs td:first-child, table.qs th:first-child { text-align: left; }
  table.qs td.t { font-weight: 800; }

  /* Plays */
  .plays { list-style: none; margin: 0; padding: 0; }
  .plays li { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid rgba(243,239,226,.1); font-size: 16px; }
  .plays li .p { font-size: 12px; color: var(--chalk-dim); }
  .plays li .s { font-variant-numeric: tabular-nums; color: var(--chalk-dim); font-size: 14px; white-space: nowrap; }
  .plays li.sc { font-weight: 700; }
  .plays li.sc .s { color: var(--chalk); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="sb" id="sb"></div>
    <div class="last" id="last"></div>
    <div class="tabs" role="tablist">
      <button data-tab="talk" class="on">Talk</button>
      <button data-tab="players">Players</button>
      <button data-tab="team">Team</button>
      <button data-tab="plays">Plays</button>
    </div>
  </div>
</header>
<main>
  <p class="warn" id="warn">Connecting to the live stats…</p>
  <section data-pane="talk"></section>
  <section data-pane="players" hidden></section>
  <section data-pane="team" hidden></section>
  <section data-pane="plays" hidden></section>
</main>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const API = (qs.get('api') || 'https://eota-stat-keeper.clee-625.workers.dev').replace(/\/$/, '');
  const GAME = 'basketball';
  const SIDES = ['home', 'away'];
  const PERIODS = ['1Q', '2Q', '3Q', '4Q', 'OT', 'OT2', 'OT3'];
  const PER_LABEL = { '1Q': '1st quarter', '2Q': '2nd quarter', '3Q': '3rd quarter', '4Q': '4th quarter', OT: 'overtime', OT2: '2nd overtime', OT3: '3rd overtime' };
  const PER_SHORT = { '1Q': '1st', '2Q': '2nd', '3Q': '3rd', '4Q': '4th', OT: 'OT', OT2: '2OT', OT3: '3OT' };
  const KEYS = ['m2', 'x2', 'm3', 'x3', 'mft', 'xft', 'oreb', 'dreb', 'ast', 'stl', 'blk', 'to', 'pf'];
  const PLAY = { m2: 'made a 2', x2: 'missed a 2', m3: 'made a 3', x3: 'missed a 3', mft: 'made a free throw', xft: 'missed a free throw',
                 oreb: 'offensive rebound', dreb: 'defensive rebound', ast: 'assist', stl: 'steal', blk: 'block', to: 'turnover', pf: 'foul' };
  const POINTS = { m2: 2, m3: 3, mft: 1 };
  const BONUS_AT = 5; // NFHS: two shots on the 5th team foul of a quarter; 4th quarter and OT together
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const html = (tag, cls, h) => { const n = el(tag, cls); n.innerHTML = h; return n; };
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const pct = (m, a) => a ? Math.round(100 * m / a) + '%' : '–';
  const lastName = n => { const w = String(n || '').trim().split(/\s+/); return w.length > 1 ? w[w.length - 1] : w[0] || ''; };
  const initials = name => {
    const words = String(name).toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
    const main = words.filter(w => !['THE', 'OF', 'AND', 'AT'].includes(w)), use = main.length ? main : words;
    return use.length > 1 ? use.map(w => w[0]).join('') : (use[0] || '');
  };

  // ---------------- Live game from the stat keeper ----------------
  let game = null, ws = null, open = false, lastPong = 0, lastSeenId = '';
  const connect = () => {
    try { ws = new WebSocket(API.replace(/^http/, 'ws') + '/ws?game=' + GAME); } catch (e) { setTimeout(connect, 3000); return; }
    ws.onopen = () => { open = true; lastPong = Date.now(); render(); };
    ws.onclose = () => { open = false; render(); setTimeout(connect, 2000); };
    ws.onmessage = e => {
      lastPong = Date.now();
      if (e.data === 'pong') return;
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.t === 'state') game = { rev: m.rev, meta: m.meta, events: m.events };
      else if (!game || m.rev !== game.rev + 1) { ws.send('sync'); return; }
      else {
        game.rev = m.rev;
        if (m.t === 'add') { const have = new Set(game.events.map(x => x.id)); game.events.push(...m.events.filter(x => !have.has(x.id))); }
        if (m.t === 'del') game.events = game.events.filter(x => !m.ids.includes(x.id));
        if (m.t === 'meta') game.meta = m.meta;
      }
      render();
    };
  };
  setInterval(() => { if (ws && ws.readyState === 1) { if (Date.now() - lastPong > 40000) ws.close(); else ws.send('ping'); } }, 15000);

  // ---------------- Everything the page shows, worked out from the plays ----------------
  const blank = () => Object.fromEntries(KEYS.map(k => [k, 0]));
  const derive = p => ({ ...p, pts: 2 * p.m2 + 3 * p.m3 + p.mft, reb: p.oreb + p.dreb, fgm: p.m2 + p.m3, fga: p.m2 + p.x2 + p.m3 + p.x3, tpa: p.m3 + p.x3, fta: p.mft + p.xft });
  const analyze = g => {
    const meta = g.meta, names = meta.names, colors = meta.colors || { home: '#17402B', away: '#1F3A93' };
    const T = {};
    for (const side of SIDES) {
      const players = (meta.rosters[side] || []).map(p => ({ ...p, side, ...blank(), byPer: {} }));
      T[side] = { side, name: names[side], short: initials(names[side]), color: colors[side], players, byId: new Map(players.map(p => [p.id, p])),
                  tot: blank(), perPts: {}, perFouls: {} };
    }
    const score = { home: 0, away: 0 }, plays = [];
    let margin = 0, leadChanges = 0, ties = 0, lastLeader = '';
    const big = { home: { by: 0 }, away: { by: 0 } };
    let run = { side: '', pts: 0, oppPts: 0 }, best = { side: '', pts: 0, period: '' };
    for (const e of g.events) {
      const t = T[e.side]; if (!t || !KEYS.includes(e.type)) continue;
      t.tot[e.type]++;
      const p = t.byId.get(e.player);
      if (p) { p[e.type]++; p.byPer[e.period] = (p.byPer[e.period] || 0) + (POINTS[e.type] || 0); }
      if (e.type === 'pf') t.perFouls[e.period] = (t.perFouls[e.period] || 0) + 1;
      const pts = POINTS[e.type] || 0;
      if (pts) {
        score[e.side] += pts;
        t.perPts[e.period] = (t.perPts[e.period] || 0) + pts;
        // runs: points one team scores before the other answers
        if (run.side === e.side) run.pts += pts; else run = { side: e.side, pts, period: e.period };
        if (run.pts > best.pts) best = { ...run };
        // lead, lead changes, ties, biggest lead
        const was = margin; margin = score.home - score.away;
        const leader = margin > 0 ? 'home' : margin < 0 ? 'away' : '';
        if (leader && lastLeader && leader !== lastLeader) leadChanges++;
        if (!leader && was !== 0) ties++;
        if (leader) lastLeader = leader;
        if (leader && Math.abs(margin) > big[leader].by) big[leader] = { by: Math.abs(margin), score: { ...score }, period: e.period };
      }
      plays.push({ ...e, who: p ? (p.num ? '#' + p.num + ' ' : '') + p.name : t.name + ' team', pts, score: { ...score } });
    }
    for (const side of SIDES) { T[side].tot = derive(T[side].tot); T[side].players = T[side].players.map(derive); }
    return { meta, T, score, plays, run, best, leadChanges, ties, big, period: meta.period };
  };
  // Team fouls that count toward the bonus: this quarter, or the 4th plus overtime.
  const bonusFouls = (t, per) => (/^OT/.test(per) ? ['4Q', ...PERIODS.filter(p => /^OT/.test(p))] : [per]).reduce((a, p) => a + (t.perFouls[p] || 0), 0);
  const other = side => side === 'home' ? 'away' : 'home';

  // A player's game as one sentence an announcer can read on air.
  const sentence = p => {
    const bits = [];
    if (p.fga || p.fta) {
      let shoot = `${plural(p.pts, 'point')}`;
      if (p.fga) shoot += ` on ${p.fgm}-of-${p.fga} shooting`;
      const extra = [p.tpa && `${p.m3}-of-${p.tpa} from three`, p.fta && `${p.mft}-of-${p.fta} at the line`].filter(Boolean);
      if (extra.length) shoot += ' (' + extra.join(', ') + ')';
      bits.push(shoot);
    } else bits.push(plural(p.pts, 'point'));
    if (p.reb) bits.push(plural(p.reb, 'rebound') + (p.oreb ? ` (${p.oreb} offensive)` : ''));
    if (p.ast) bits.push(plural(p.ast, 'assist'));
    if (p.stl) bits.push(plural(p.stl, 'steal'));
    if (p.blk) bits.push(plural(p.blk, 'block'));
    const list = bits.length < 3 ? bits.join(' and ') : bits.slice(0, -1).join(', ') + ', and ' + bits[bits.length - 1];
    return list + '.';
  };
  const raw = p => [p.pts + ' PTS', p.fgm + '-' + p.fga + ' FG', p.m3 + '-' + p.tpa + ' 3P', p.mft + '-' + p.fta + ' FT',
                    p.reb + ' REB (' + p.oreb + 'O)', p.ast + ' AST', p.stl + ' STL', p.blk + ' BLK', p.to + ' TO', p.pf + ' PF'].join(' · ');
  const doubleDigits = p => ['pts', 'reb', 'ast', 'stl', 'blk'].filter(k => p[k] >= 10);
  const nearDouble = p => ['pts', 'reb', 'ast'].filter(k => p[k] >= 8);
  const leaders = (t, k) => { const top = Math.max(0, ...t.players.map(p => p[k])); return top ? t.players.filter(p => p[k] === top) : []; };
  const nm = p => (p.num ? '#' + p.num + ' ' : '') + p.name;

  // ---------------- Drawing ----------------
  let tab = 'talk';
  const render = () => {
    $('warn').hidden = !!game;
    $('warn').textContent = open ? 'Waiting for the game…' : 'Connecting to the live stats…';
    if (!game) return;
    const A = analyze(game), L = 'away', R = 'home'; // the broadcast convention: home on the right
    // Header
    const team = (side, cls) => {
      const t = A.T[side], f = bonusFouls(t, A.period), oppF = bonusFouls(A.T[other(side)], A.period), d = el('div', 'tm ' + cls);
      d.style.setProperty('--c', t.color);
      const m = el('div', 'meta');
      const n = el('div', 'nm'); n.append(el('span', 'full', t.name), el('span', 'short', t.short)); m.append(n);
      m.append(html('div', 'sub', `Fouls ${f}${oppF >= BONUS_AT ? ' · <b class="bonus">BONUS</b>' : ''}`));
      d.append(el('i', 'chip'), m);
      return d;
    };
    const mid = el('div', 'mid');
    mid.append(el('div', 'score', A.score[L] + '–' + A.score[R]));
    mid.append(html('div', 'per', `<span class="conn${open ? ' ok' : ''}"></span>${PER_SHORT[A.period] || A.period}`));
    $('sb').replaceChildren(team(L, 'L'), mid, team(R, 'R'));
    const lp = A.plays[A.plays.length - 1];
    $('last').innerHTML = lp ? `Last: <b>${esc(lp.who)}</b> (${esc(A.T[lp.side].short)}) ${PLAY[lp.type]}` : 'No plays yet.';
    if (lp && lp.id !== lastSeenId) { if (lastSeenId) { $('last').classList.remove('flash'); void $('last').offsetWidth; $('last').classList.add('flash'); } lastSeenId = lp.id; }
    if (tab === 'talk') renderTalk(A);
    if (tab === 'players') renderPlayers(A);
    if (tab === 'team') renderTeam(A);
    if (tab === 'plays') renderPlays(A);
  };

  const card = (title, items) => {
    const c = el('div', 'card'); c.append(el('h2', null, title));
    const ul = el('ul', 'say');
    items.filter(Boolean).forEach(h => ul.append(html('li', null, h)));
    if (!ul.children.length) ul.append(html('li', null, '<small>Nothing yet.</small>'));
    c.append(ul); return c;
  };
  const tshort = (A, side) => `<span class="dot" style="--c:${esc(A.T[side].color)}"></span>${esc(A.T[side].short)}`;
  const tname = (A, side) => `<span class="dot" style="--c:${esc(A.T[side].color)}"></span>${esc(A.T[side].name)}`;

  const renderTalk = A => {
    const { T, score, period } = A, h = score.home, a = score.away;
    // Right now
    const now = [];
    now.push(`<span class="big">${h === a ? `Tied at ${h}` : `${tshort(A, h > a ? 'home' : 'away')} leads ${Math.max(h, a)}–${Math.min(h, a)}`}</span>`);
    if (A.run.pts >= 4) now.push(`<span class="hot">${esc(T[A.run.side].short)} on a ${A.run.pts}–0 run</span>`);
    const thisPer = SIDES.map(s => T[s].perPts[period] || 0);
    if (thisPer[0] + thisPer[1]) now.push(`This ${PER_LABEL[period] || period}: ${esc(T.home.short)} ${thisPer[0]}, ${esc(T.away.short)} ${thisPer[1]}`);
    for (const side of SIDES) {
      const f = bonusFouls(T[other(side)], period);
      if (f >= BONUS_AT) now.push(`${esc(T[side].short)} is in the bonus <small>${esc(T[other(side)].short)} has ${plural(f, 'team foul')} ${/^OT/.test(period) ? 'in the 4th and OT' : 'this quarter'}</small>`);
    }
    // Hot hand this period
    for (const side of SIDES) {
      const tp = T[side].perPts[period] || 0, top = T[side].players.map(p => [p, p.byPer[period] || 0]).sort((x, y) => y[1] - x[1])[0];
      if (top && top[1] >= 5) now.push(`<span class="hot">${esc(lastName(top[0].name))}</span> has ${top[1]} of ${esc(T[side].short)}'s ${tp} this ${PER_LABEL[period] || 'period'}`);
    }
    // Game flow
    const flow = [];
    if (A.best.pts >= 5) flow.push(`Biggest run: ${esc(T[A.best.side].short)} ${A.best.pts}–0 <small>${PER_LABEL[A.best.period] || ''}</small>`);
    for (const side of SIDES) if (A.big[side].by) flow.push(`${esc(T[side].short)}'s biggest lead: ${A.big[side].by} <small>${A.big[side].score.home}–${A.big[side].score.away} (${esc(T.home.short)}–${esc(T.away.short)}), ${PER_LABEL[A.big[side].period] || ''}</small>`);
    flow.push(`${plural(A.leadChanges, 'lead change')}, ${plural(A.ties, 'tie')}`);
    PERIODS.filter(p => p !== period && PERIODS.indexOf(p) < PERIODS.indexOf(period)).forEach(p => {
      const x = T.home.perPts[p] || 0, y = T.away.perPts[p] || 0;
      if (x !== y) flow.push(`${esc(T[x > y ? 'home' : 'away'].short)} won the ${PER_LABEL[p]} ${Math.max(x, y)}–${Math.min(x, y)}`);
      else if (x) flow.push(`The ${PER_LABEL[p]} was even, ${x}–${y}`);
    });
    // Leaders
    const lead = [];
    for (const side of SIDES) {
      const parts = [['pts', 'PTS'], ['reb', 'REB'], ['ast', 'AST'], ['stl', 'STL'], ['blk', 'BLK']].map(([k, lbl]) => {
        const l = leaders(T[side], k);
        if (!l.length || (k !== 'pts' && l[0][k] < 2)) return '';
        return `${l.length > 2 ? l.length + ' tied at' : l.map(p => esc(lastName(p.name))).join('/')} ${l[0][k]} ${lbl}`;
      }).filter(Boolean);
      if (parts.length) lead.push(`${tshort(A, side)}: ${parts.join(' · ')}`);
    }
    // Shooting
    const shoot = SIDES.map(side => {
      const t = T[side].tot;
      if (!t.fga && !t.fta) return '';
      return `${tshort(A, side)} ${pct(t.fgm, t.fga)} from the field (${t.fgm}-${t.fga}), ${pct(t.m3, t.tpa)} from three (${t.m3}-${t.tpa}), ${pct(t.mft, t.fta)} at the line (${t.mft}-${t.fta})`;
    });
    const glass = [];
    const th = T.home.tot, ta = T.away.tot;
    if (th.reb + ta.reb) glass.push(`Rebounds: ${esc(T.home.short)} ${th.reb}, ${esc(T.away.short)} ${ta.reb} <small>Offensive: ${th.oreb}–${ta.oreb}</small>`);
    if (th.to + ta.to) glass.push(`Turnovers: ${esc(T.home.short)} ${th.to}, ${esc(T.away.short)} ${ta.to} <small>Steals: ${th.stl}–${ta.stl}</small>`);
    if (th.ast + ta.ast) glass.push(`Assists: ${esc(T.home.short)} ${th.ast}, ${esc(T.away.short)} ${ta.ast}` + (th.fgm || ta.fgm ? ` <small>Assisted baskets: ${pct(th.ast, th.fgm)} – ${pct(ta.ast, ta.fgm)}</small>` : ''));
    // Watch list: foul trouble, double-doubles, near ones
    const watch = [];
    for (const side of SIDES) for (const p of T[side].players) {
      if (p.pf >= 5) watch.push(`${esc(nm(p))} (${esc(T[side].short)}) has <span class="hot">fouled out</span>`);
      else if (p.pf >= 3) watch.push(`${esc(nm(p))} (${esc(T[side].short)}) has ${p.pf} fouls`);
      const dd = doubleDigits(p);
      if (dd.length >= 2) watch.push(`<span class="hot">${esc(nm(p))}</span> has a ${dd.length >= 3 ? 'triple' : 'double'}-double: ${dd.map(k => p[k] + ' ' + k.toUpperCase()).join(', ')}`);
      else { const nd = nearDouble(p); if (nd.length >= 2) watch.push(`${esc(nm(p))} is close to a double-double: ${nd.map(k => p[k] + ' ' + k.toUpperCase()).join(', ')}`); }
      if (p.pts >= 20) watch.push(`${esc(nm(p))} has <span class="hot">${p.pts} points</span>`);
    }
    const pane = document.querySelector('[data-pane=talk]');
    const two = el('div', 'grid2');
    two.append(card('Leaders', lead), card('Shooting', shoot));
    pane.replaceChildren(card('Right now', now), card('Watch', watch), two, card('On the glass and the ball', glass), card('Game flow', flow));
  };

  const renderPlayers = A => {
    const pane = document.querySelector('[data-pane=players]'), two = el('div', 'grid2');
    for (const side of ['away', 'home']) {
      const t = A.T[side], c = el('div', 'card');
      c.append(html('h2', null, `${tname(A, side)} · ${t.tot.pts}`));
      const list = [...t.players].sort((x, y) => y.pts - x.pts || y.reb + y.ast - (x.reb + x.ast));
      for (const p of list) {
        const played = KEYS.some(k => p[k]);
        const d = el('div', 'pl' + (played ? '' : ' dnp'));
        const who = el('div', 'who'), b = el('b', null, nm(p));
        if (p.pf >= 5) b.append(el('span', 'tag', 'FOULED OUT')); else if (p.pf >= 3) b.append(el('span', 'tag', p.pf + ' FOULS'));
        if (doubleDigits(p).length >= 2) b.append(el('span', 'tag dd', doubleDigits(p).length >= 3 ? 'TRIPLE-DOUBLE' : 'DOUBLE-DOUBLE'));
        who.append(b, el('span', null, p.pts));
        d.append(who);
        if (played) d.append(el('div', 'line', lastName(p.name) + ': ' + sentence(p)), el('div', 'raw', raw(p)));
        else d.append(el('div', 'raw', 'No stats yet'));
        c.append(d);
      }
      if (!list.length) c.append(el('p', 'raw', 'No roster entered on the stat keeper page.'));
      two.append(c);
    }
    pane.replaceChildren(two);
  };

  const ROWS = [['Field goals', t => [t.fgm + '-' + t.fga, pct(t.fgm, t.fga), t.fga ? t.fgm / t.fga : 0]], ['3-pointers', t => [t.m3 + '-' + t.tpa, pct(t.m3, t.tpa), t.tpa ? t.m3 / t.tpa : 0]],
                ['Free throws', t => [t.mft + '-' + t.fta, pct(t.mft, t.fta), t.fta ? t.mft / t.fta : 0]], ['Rebounds', t => [t.reb, '', t.reb]], ['Offensive reb.', t => [t.oreb, '', t.oreb]],
                ['Defensive reb.', t => [t.dreb, '', t.dreb]], ['Assists', t => [t.ast, '', t.ast]], ['Steals', t => [t.stl, '', t.stl]], ['Blocks', t => [t.blk, '', t.blk]],
                ['Turnovers', t => [t.to, '', t.to]], ['Fouls', t => [t.pf, '', t.pf]]];
  // Very dark team colors are lightened for the bars so they show on the green card.
  const barColor = c => { const n = parseInt(String(c).slice(1), 16); return (.2126 * (n >> 16) + .7152 * (n >> 8 & 255) + .0722 * (n & 255)) / 255 < .3 ? `color-mix(in srgb, ${c} 55%, #fff)` : c; };
  const renderTeam = A => {
    const pane = document.querySelector('[data-pane=team]'), L = A.T.away, R = A.T.home;
    // Header row lines up with the columns: opponent on the left, VS in the middle, FBCA on the right.
    const c = el('div', 'card'), tbl = el('table', 'cmp'), names = el('tr', 'head');
    names.append(html('td', null, tname(A, 'away')), el('td', 'lbl vs', 'vs'), html('td', null, tname(A, 'home')));
    tbl.append(names);
    for (const [label, fn] of ROWS) {
      const [lv, lp, ln] = fn(L.tot), [rv, rp, rn] = fn(R.tot), tr = el('tr');
      const mid = html('td', 'lbl', esc(label) + ((ln + rn) > 0 ? `<div class="bar"><i style="width:${100 * ln / (ln + rn)}%;background:${esc(barColor(L.color))}"></i><i style="width:${100 * rn / (ln + rn)}%;background:${esc(barColor(R.color))}"></i></div>` : ''));
      tr.append(html('td', null, `${lv} <small>${lp}</small>`), mid, html('td', null, `<small>${rp}</small> ${rv}`));
      tbl.append(tr);
    }
    c.append(tbl);
    // Scoring by quarter
    const used = PERIODS.filter(p => p === A.period || L.perPts[p] || R.perPts[p] || PERIODS.indexOf(p) < 4 && PERIODS.indexOf(p) <= PERIODS.indexOf(A.period));
    const q = el('div', 'card'); q.append(el('h2', null, 'Scoring by quarter'));
    const qt = el('table', 'qs'), head = el('tr');
    head.append(el('th', null, ''), ...used.map(p => el('th', null, PER_SHORT[p])), el('th', null, 'T'));
    qt.append(head);
    for (const t of [L, R]) {
      const tr = el('tr'); tr.append(html('td', null, `<span class="dot" style="--c:${esc(t.color)}"></span>${esc(t.short)}`), ...used.map(p => el('td', null, t.perPts[p] || 0)), el('td', 't', t.tot.pts));
      qt.append(tr);
    }
    q.append(qt);
    pane.replaceChildren(c, q);
  };

  const renderPlays = A => {
    const pane = document.querySelector('[data-pane=plays]'), c = el('div', 'card'), ul = el('ul', 'plays');
    c.append(el('h2', null, 'Plays, newest first'));
    for (const p of [...A.plays].reverse().slice(0, 150)) {
      const li = el('li', p.pts ? 'sc' : '');
      li.append(el('span', 'p', PER_SHORT[p.period] || p.period), html('span', null, `<span class="dot" style="--c:${esc(A.T[p.side].color)}"></span>${esc(p.who)} ${PLAY[p.type]}`),
                el('span', 's', p.pts ? `${A.T.away.short} ${p.score.away}–${p.score.home} ${A.T.home.short}` : ''));
      ul.append(li);
    }
    if (!ul.children.length) ul.append(el('li', null, 'No plays yet.'));
    c.append(ul); pane.replaceChildren(c);
  };

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== tab);
    render(); scrollTo(0, 0);
  });
  // Keep the phone awake while it's open.
  let wake = null;
  const keepAwake = () => { if (!wake && navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; w.onrelease = () => wake = null; }).catch(() => {}); };
  document.addEventListener('click', keepAwake, { once: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  connect();
})();
</script>
</body>
</html>

<!--
  Live baseball / softball stats for the Eagles on the Air play-by-play and color announcers. Read-only: it
  listens to the game the stat crew enters pitches and plays into (graphics/baseball-stats.html), so it
  updates the moment a play is recorded. Built for a phone first, works on a laptop.

  Tabs: Talk (ready-to-read lines: the situation, who's up and who's pitching with their numbers, scoring,
  things to watch, leaders, pitchers), Players (each batter's game as a sentence, season numbers, the pitchers'
  lines), Team (line score and side-by-side totals), Plays (the log with innings and the running score).
  ?game=softball (or the sport picked on the stat keeper) picks softball. ?api=http://localhost:8787 points it
  at a local copy of the worker.
-->
<style>
  :root {
    --pine: #0D2418; --field: #17402B; --turf: #1E5638; --line: #2C6A46;
    --gold: #D9A521; --gold-hi: #F2C14E; --chalk: #F3EFE2; --chalk-dim: #B9C6B4; --tally: #E5352B; --ok: #5FC48A;
    --font-display: 'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif;
    --font-body: 'Barlow', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--pine); color: var(--chalk); font-family: var(--font-body); font-size: 17px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
  button { font: 600 15px var(--font-body); color: var(--chalk); background: var(--turf); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; min-height: 42px; }
  button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 1px; }

  /* Score header: always in view */
  .top { position: sticky; top: 0; z-index: 5; background: var(--pine); border-bottom: 1px solid var(--line); padding: 8px 14px 8px; padding-top: max(8px, env(safe-area-inset-top)); }
  .wrap { max-width: 980px; margin: 0 auto; }
  .sb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .tm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tm.R { flex-direction: row-reverse; text-align: right; }
  .chip { flex: none; width: 10px; align-self: stretch; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.45); }
  .tm .nm { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm .nm .short { display: none; }
  @media (max-width: 640px) { .tm .nm .full { display: none; } .tm .nm .short { display: inline; } }
  .tm .masc { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--chalk); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
  .tm .sub { font-size: 13px; color: var(--chalk-dim); white-space: nowrap; }
  .tm .sub b.yc { color: #F2D43A; }
  .tm .sub b.rc { color: #ff6b6b; }
  .tm .meta { min-width: 0; }
  .mid { text-align: center; }
  .score { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .per { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--chalk-dim); text-transform: uppercase; }
  .conn { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--tally); margin-right: 5px; vertical-align: 1px; }
  .conn.ok { background: var(--ok); }
  .last { margin-top: 6px; font-size: 14px; color: var(--chalk-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; border-radius: 6px; padding: 2px 6px; }
  .last b { color: var(--chalk); }
  .last.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: rgba(242,193,78,.35); } 100% { background: transparent; } }
  .tabs { display: flex; gap: 6px; margin-top: 8px; }
  .tabs button { flex: 1; min-height: 38px; padding: 4px 6px; }
  .tabs button.on { background: var(--gold); color: var(--pine); border-color: var(--gold); }

  main { max-width: 980px; margin: 0 auto; padding: 12px 14px 60px; }
  .warn { color: var(--gold-hi); font-size: 15px; }
  .card { background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 17px; color: var(--gold); margin: 0 0 6px; }
  .say { list-style: none; margin: 0; padding: 0; }
  .say li { padding: 7px 0; border-top: 1px solid rgba(243,239,226,.1); font-size: 18px; }
  .say li:first-child { border-top: 0; }
  .say li small { display: block; font-size: 13px; color: var(--chalk-dim); }
  .say .big { font-size: 21px; font-weight: 700; }
  .say .hot { color: var(--gold-hi); font-weight: 700; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.45); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }

  /* Players */
  .pl { padding: 9px 0; border-top: 1px solid rgba(243,239,226,.1); }
  .pl:first-of-type { border-top: 0; }
  .pl .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .pl .who b { font-size: 19px; }
  .pl .who > span { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
  .pl .line { font-size: 16px; }
  .pl .raw { font-size: 13px; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
  .pl .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-left: 6px; background: rgba(229,53,43,.25); color: #ffb3ad; vertical-align: 2px; }
  .pl .tag.yc { background: rgba(242,212,58,.22); color: #F2D43A; }
  .pl .tag.dd { background: rgba(242,193,78,.2); color: var(--gold-hi); }
  .pl.dnp { color: var(--chalk-dim); }

  /* Team comparison */
  table.cmp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.cmp td { padding: 7px 4px; border-top: 1px solid rgba(243,239,226,.1); font-size: 17px; }
  table.cmp tr:first-child td { border-top: 0; }
  table.cmp td:first-child { text-align: left; font-weight: 700; }
  table.cmp td:last-child { text-align: right; font-weight: 700; }
  table.cmp td.lbl { text-align: center; font-size: 13px; letter-spacing: .08em; color: var(--chalk-dim); text-transform: uppercase; width: 34%; }
  table.cmp tr.head td { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: .05em; text-transform: uppercase; color: var(--gold); padding-bottom: 10px; vertical-align: bottom; }
  table.cmp tr.head td.vs { font-size: 15px; color: var(--chalk-dim); letter-spacing: .12em; }
  table.cmp tr:nth-child(2) td { border-top: 0; }
  table.cmp small { font-size: 13px; color: var(--chalk-dim); font-weight: 600; }
  .bar { display: flex; height: 5px; margin-top: 3px; background: rgba(243,239,226,.1); border-radius: 3px; overflow: hidden; }
  table.qs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; text-align: center; }
  table.qs th, table.qs td { padding: 6px 4px; border-top: 1px solid rgba(243,239,226,.1); }
  table.qs th { font-size: 12px; color: var(--chalk-dim); border-top: 0; letter-spacing: .08em; }
  table.qs td:first-child, table.qs th:first-child { text-align: left; }
  table.qs td.t { font-weight: 800; }

  /* Plays */
  .plays { list-style: none; margin: 0; padding: 0; }
  .plays li { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid rgba(243,239,226,.1); font-size: 16px; }
  .plays li .p { font-size: 12px; color: var(--chalk-dim); }
  .plays li .s { font-variant-numeric: tabular-nums; color: var(--chalk-dim); font-size: 14px; white-space: nowrap; }
  .plays li.sc { font-weight: 700; }
  .plays li.sc .s { color: var(--chalk); }
  [hidden] { display: none !important; }

  /* ---------- Theme: dark charcoal panels, like the scorebug controls and stat keepers ----------
     Green = live connection.  Red = not connected, red cards.  Blue = selected.  Amber = highlights to mention. */
  :root {
    --pine: #0F1012; --field: #1A1B1E; --turf: #2A2C31; --line: #3A3D44;
    --chalk: #F1F2F4; --chalk-dim: #A3A7AF; --tally: #F43B3B; --ok: #22D865;
    --cue: #2F7BFF; --gold-hi: #FFB21E; --head: #D5D8DE;
  }
  .top { background: #141518; border-bottom-color: #2C2E33; }
  .card { background: linear-gradient(#1D1E22, #17181B); border-color: #2C2E33; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .card h2, table.cmp tr.head td { color: var(--head); }
  button { background: linear-gradient(#32343A, #282A2F); border-color: #43464E; box-shadow: inset 0 1px 0 rgba(255,255,255,.07); }
  button:focus-visible { outline-color: var(--cue); }
  .tabs button.on { color: #fff; background: #3A3D44; border-color: #6B7079; box-shadow: inset 0 -3px 0 #fff; }
  .conn.ok { box-shadow: 0 0 6px rgba(34,216,101,.7); }
  .last.flash { animation-name: flashC; }
  @keyframes flashC { 0% { background: rgba(255,178,30,.35); } 100% { background: transparent; } }
  /* ---------- Baseball ---------- */
  .sit { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 2px; }
  .dmd { position: relative; width: 38px; height: 28px; flex: none; }
  .dmd i { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--chalk-dim); }
  .dmd i.on { background: var(--gold-hi); border-color: var(--gold-hi); }
  .dmd .b2 { left: 13px; top: 1px; } .dmd .b1 { left: 24px; top: 12px; } .dmd .b3 { left: 2px; top: 12px; }
  .outs i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--chalk-dim); margin: 0 1.5px; vertical-align: 0; }
  .outs i.on { background: var(--tally); border-color: var(--tally); }
  .cnt { font-family: var(--font-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .ab { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 15px; margin-top: 6px; }
  .ab .k { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--chalk-dim); align-self: center; }
  .ab b { font-weight: 700; }
  table.ls { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; text-align: center; }
  table.ls th, table.ls td { padding: 6px 3px; border-top: 1px solid rgba(243,239,226,.1); }
  table.ls th { font-size: 12px; color: var(--chalk-dim); border-top: 0; letter-spacing: .06em; }
  table.ls td:first-child, table.ls th:first-child { text-align: left; white-space: nowrap; }
  table.ls td.t { font-weight: 800; }
  table.ls td.now { box-shadow: inset 0 -3px 0 var(--gold-hi); }
  table.bx { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
  table.bx th, table.bx td { padding: 5px 4px; border-top: 1px solid rgba(243,239,226,.1); text-align: center; }
  table.bx th { font-size: 12px; color: var(--chalk-dim); border-top: 0; letter-spacing: .06em; }
  table.bx td:first-child, table.bx th:first-child { text-align: left; }
  table.bx tr.up td { color: var(--gold-hi); font-weight: 700; }
  .scroll { overflow-x: auto; }
  .tag.k { background: rgba(47,123,255,.22); color: #9cc0ff; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="sb" id="sb"></div>
    <div class="sit" id="sit"></div>
    <div class="last" id="last"></div>
    <div class="tabs" role="tablist">
      <button data-tab="talk" class="on">Talk</button>
      <button data-tab="players">Players</button>
      <button data-tab="team">Team</button>
      <button data-tab="plays">Plays</button>
    </div>
  </div>
</header>
<main>
  <p class="warn" id="warn">Connecting to the live stats…</p>
  <section data-pane="talk"></section>
  <section data-pane="players" hidden></section>
  <section data-pane="team" hidden></section>
  <section data-pane="plays" hidden></section>
</main>

<script src="baseball.js"></script>
<script>
(() => {
  const BB = window.EotaBaseball, SIDES = ['home', 'away'];
  const qs = new URLSearchParams(location.search);
  const API = (qs.get('api') || 'https://eota-stat-keeper.clee-625.workers.dev').replace(/\/$/, '');
  // Baseball or softball: ?game=, else the sport picked on the stat keeper on this device
  const pickGame = () => { const q = qs.get('game'); if (q === 'baseball' || q === 'softball') return q; try { const v = JSON.parse(localStorage.getItem('eota-baseball-sport')); if (v === 'softball') return v; } catch (e) {} return 'baseball'; };
  const GAME = pickGame(), SPORT = GAME === 'softball' ? 'Softball' : 'Baseball';
  document.title = 'EOTA ' + SPORT + ' Announcer Stats';
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const html = (tag, cls, h) => { const n = el(tag, cls); n.innerHTML = h; return n; };
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const lastName = n => { const w = String(n || '').trim().split(/\s+/); return w.length > 1 ? w[w.length - 1] : w[0] || ''; };
  const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  const halfName = p => { const m = /^([TB])(\d+)$/.exec(p || ''); return m ? (m[1] === 'T' ? 'Top ' : 'Bot ') + ordinal(+m[2]) : ''; };
  const halfShort = p => { const m = /^([TB])(\d+)$/.exec(p || ''); return m ? (m[1] === 'T' ? '▲' : '▼') + m[2] : ''; };

  // ---------------- Live game from the stat keeper, and the season stats ----------------
  let game = null, ws = null, open = false, lastPong = 0, lastSeenId = '', seasons = null;
  const connect = () => {
    try { ws = new WebSocket(API.replace(/^http/, 'ws') + '/ws?game=' + GAME); } catch (e) { setTimeout(connect, 3000); return; }
    ws.onopen = () => { open = true; lastPong = Date.now(); render(); };
    ws.onclose = () => { open = false; render(); setTimeout(connect, 2000); };
    ws.onmessage = e => {
      lastPong = Date.now();
      if (e.data === 'pong') return;
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.t === 'season') { loadSeasons(); return; }
      if (m.t === 'state') game = { rev: m.rev, meta: m.meta, events: m.events };
      else if (!game || m.rev !== game.rev + 1) { ws.send('sync'); return; }
      else {
        game.rev = m.rev;
        if (m.t === 'add') { const have = new Set(game.events.map(x => x.id)); game.events.push(...m.events.filter(x => !have.has(x.id))); }
        if (m.t === 'del') game.events = game.events.filter(x => !m.ids.includes(x.id));
        if (m.t === 'meta') game.meta = m.meta;
      }
      render();
    };
  };
  setInterval(() => { if (ws && ws.readyState === 1) { if (Date.now() - lastPong > 40000) ws.close(); else ws.send('ping'); } }, 15000);
  const loadSeasons = async () => {
    try { const r = await fetch(API + '/season?game=' + GAME, { cache: 'no-store' }); const d = await r.json(); if (r.ok) seasons = d.teams || []; } catch (e) {}
    render();
  };

  // ---------------- Everything the page shows, worked out from the plays ----------------
  // Very dark team colors are lightened so they show on the dark page
  const readable = c => { const n = parseInt(String(c || '#888888').slice(1), 16); return (.2126 * (n >> 16) + .7152 * (n >> 8 & 255) + .0722 * (n & 255)) / 255 < .3 ? `color-mix(in srgb, ${c} 45%, #fff)` : c; };
  const analyze = g => {
    const meta = g.meta, st = BB.compute(meta, g.events), sit = st.sit, names = meta.names || { home: 'Home', away: 'Visitors' };
    const colors = meta.colors || { home: '#17402B', away: '#1F3A93' };
    const T = {};
    for (const side of SIDES) {
      const roster = (meta.rosters && meta.rosters[side]) || [];
      const rec = (seasons || []).find(t => t.name.toLowerCase() === String((meta.saved || {})[side] || names[side]).toLowerCase());
      const sea = BB.seasonTotals(rec, { id: meta.gameId, players: BB.gamePlayers(meta, st, side) });
      // FBCA (home on the stat keeper) shows in gold here, which reads better than its green on this page
      T[side] = { side, name: names[side], color: side === 'home' ? '#F2C14E' : readable(colors[side]), roster, byId: new Map(roster.map(p => [p.id, p])),
                  order: BB.orderOf(meta, side), sea, tot: st.team[side], bat: st.bat[side], pit: st.pit[side] };
    }
    const who = (side, id) => { const p = T[side].byId.get(id); return p ? (p.num ? '#' + p.num + ' ' : '') + p.name : T[side].name; };
    const seaOf = (side, id) => { const p = T[side].byId.get(id); return p ? BB.seasonFor(T[side].sea, p.name) : null; };
    // The plays (not the single pitches), with the score after each
    const plays = [];
    for (const e of g.events) {
      if (!['pa', 'br', 'pc'].includes(e.type)) continue;
      const d = BB.dataOf(e) || {}, runs = (d.runs || []).length, sc = d.sit ? d.sit.score : null;
      let words = '';
      if (e.type === 'pa') words = `${who(e.side, e.player)}: ${d.r === 'HR' && runs === 4 ? 'Grand slam' : (BB.RESULTS[d.r] || {}).l || d.r}` + (d.rbi ? `, ${plural(d.rbi, 'RBI', 'RBI')}` : '');
      if (e.type === 'br') words = `${BB.RUNS[d.r] || d.r}` + (e.player && e.player !== 'team' ? `: ${who(e.side, e.player)}` : '');
      if (e.type === 'pc') words = `Pitching change: ${who(e.side, e.player)}`;
      plays.push({ e, d, runs, words, period: e.period, side: e.side, score: sc, big: d.r === 'HR' });
    }
    // Lead changes and ties, from the runs as they scored
    let lead = '', leadChanges = 0, ties = 0;
    const run = { home: 0, away: 0 };
    for (const p of plays) if (p.runs) {
      run[p.side] += p.runs; const now = run.home > run.away ? 'home' : run.away > run.home ? 'away' : '';
      if (now && lead && now !== lead) leadChanges++; if (!now) ties++; if (now) lead = now;
    }
    const last = g.events[g.events.length - 1], between = !!last && last.period !== BB.period(sit);
    return { meta, st, sit, T, who, seaOf, plays, leadChanges, ties, final: meta.status === 'final', between, innings: meta.innings || 7 };
  };

  // A batter's game as one sentence an announcer can read on air: "2 for 3 with a home run and 2 RBI."
  const batSentence = b => {
    if (!b || !b.PA) return 'Hasn\'t batted yet.';
    const bits = [];
    const xb = [['HR', 'home run', 'home runs'], ['3B', 'triple', 'triples'], ['2B', 'double', 'doubles']].filter(([k]) => b[k]).map(([k, one, many]) => b[k] === 1 ? 'a ' + one : b[k] + ' ' + many);
    bits.push(...xb);
    if (b.RBI) bits.push(plural(b.RBI, 'RBI', 'RBI'));
    if (b.BB) bits.push(b.BB === 1 ? 'a walk' : b.BB + ' walks');
    if (b.HBP) bits.push('hit by a pitch' + (b.HBP > 1 ? ' ' + b.HBP + ' times' : ''));
    if (b.SB) bits.push(plural(b.SB, 'stolen base'));
    if (b.R) bits.push(plural(b.R, 'run') + ' scored');
    if (b.SO) bits.push(plural(b.SO, 'strikeout'));
    const list = bits.length < 3 ? bits.join(' and ') : bits.slice(0, -1).join(', ') + ', and ' + bits[bits.length - 1];
    return `${b.H} for ${b.AB}` + (list ? ' with ' + list : '') + '.';
  };
  const batRaw = b => b ? `${b.H}-${b.AB} · ${b.R} R · ${b.RBI} RBI · ${b['2B']} 2B · ${b['3B']} 3B · ${b.HR} HR · ${b.BB} BB · ${b.SO} K · ${b.SB} SB` : '';
  const pitLine = q => `${BB.ip(q.outs)} IP, ${q.H} H, ${q.R} R (${q.ER} ER), ${q.BB} BB, ${q.SO} K, ${q.NP} pitches`;
  const seaBat = t => t && t.bat.AB ? `${BB.avg(t.bat)} AVG, ${t.bat.HR} HR, ${t.bat.RBI} RBI` : '';
  const seaPit = (t, inn) => t && t.pit.outs ? `${BB.era(t.pit, inn)} ERA, ${t.pit.W}-${t.pit.L}, ${t.pit.SO} K in ${BB.ip(t.pit.outs)} IP` : '';
  const nm = (A, side, id) => esc(A.who(side, id));

  // ---------------- Drawing ----------------
  let tab = 'talk';
  const render = () => {
    $('warn').hidden = !!game;
    $('warn').textContent = open ? 'Waiting for the game…' : 'Connecting to the live stats…';
    if (!game) return;
    const A = analyze(game), sit = A.sit;
    // Header: FBCA (home) on the left, as on the other announcer pages
    const team = (side, cls) => {
      const t = A.T[side], d = el('div', 'tm ' + cls); d.style.setProperty('--c', t.color);
      const m = el('div', 'meta'), n = el('div', 'nm'); n.append(el('span', 'full', t.name), el('span', 'short', t.name)); m.append(n);
      const masc = ((game.meta.mascots || {})[side] || '').trim(); if (masc) m.append(el('div', 'masc', masc)); // the mascot (from the stat keeper's Setup), under the name
      m.append(el('div', 'sub', `${t.tot.H} H · ${t.tot.E} E · ${t.tot.LOB} LOB`));
      d.append(el('i', 'chip'), m); return d;
    };
    const mid = el('div', 'mid');
    mid.append(el('div', 'score', sit.score.home + '–' + sit.score.away));
    const when = A.final ? 'Final' + (sit.inn > A.innings ? ' · ' + sit.inn + ' inn' : '') : A.between ? (sit.top ? 'Mid ' + ordinal(sit.inn - 1) : 'End ' + ordinal(sit.inn)) : (sit.top ? 'Top ' : 'Bot ') + ordinal(sit.inn);
    mid.append(html('div', 'per', `<span class="conn${open ? ' ok' : ''}"></span>${esc(when)}`));
    $('sb').replaceChildren(team('home', 'L'), mid, team('away', 'R'));
    // The situation: bases, count, outs
    const s2 = $('sit');
    if (A.final || A.between) s2.replaceChildren();
    else {
      const d = el('div', 'dmd'); [1, 2, 3].forEach(i => { const b = el('i', 'b' + i + (sit.bases[i - 1] ? ' on' : '')); d.append(b); });
      const outs = html('span', 'outs', [0, 1].map(i => `<i class="${i < sit.o ? 'on' : ''}"></i>`).join('') + `<i class="${2 < sit.o ? 'on' : ''}"></i>`);
      s2.replaceChildren(d, el('span', 'cnt', sit.b + '-' + sit.s), outs, el('span', 'per', plural(sit.o, 'out')));
    }
    const lp = A.plays[A.plays.length - 1];
    $('last').innerHTML = lp ? `Last: <b>${esc(lp.words)}</b>${lp.runs ? ' · ' + plural(lp.runs, 'run') + ' scored' : ''} · ${esc(halfName(lp.period))}` : 'No plays yet.';
    if (lp && lp.e.id !== lastSeenId) { if (lastSeenId) { $('last').classList.remove('flash'); void $('last').offsetWidth; $('last').classList.add('flash'); } lastSeenId = lp.e.id; }
    if (tab === 'talk') renderTalk(A);
    if (tab === 'players') renderPlayers(A);
    if (tab === 'team') renderTeam(A);
    if (tab === 'plays') renderPlays(A);
  };

  const card = (title, items) => {
    const c = el('div', 'card'); c.append(el('h2', null, title));
    const ul = el('ul', 'say');
    items.filter(Boolean).forEach(h => ul.append(html('li', null, h)));
    if (!ul.children.length) ul.append(html('li', null, '<small>Nothing yet.</small>'));
    c.append(ul); return c;
  };
  const tshort = (A, side) => `<span class="dot" style="--c:${esc(A.T[side].color)}"></span>${esc(A.T[side].name)}`;

  const renderTalk = A => {
    const { T, sit, st } = A, h = sit.score.home, a = sit.score.away, inn = A.innings;
    const bat = BB.batting(sit), fld = BB.fielding(sit);
    // Right now
    const now = [];
    now.push(`<span class="big">${h === a ? (h ? `Tied ${h}–${a}` : 'Scoreless') : `${tshort(A, h > a ? 'home' : 'away')} ${A.final ? 'won' : 'leads'} ${Math.max(h, a)}–${Math.min(h, a)}`}</span>`);
    if (!A.final) {
      const on = sit.bases.map((b, i) => b ? ['first', 'second', 'third'][i] : '').filter(Boolean);
      now.push(A.between ? `Between innings. ${tshort(A, bat)} bats next.` : `${tshort(A, bat)} batting, ${plural(sit.o, 'out')}, ` + (on.length === 3 ? 'bases loaded' : on.length ? 'runner' + (on.length > 1 ? 's' : '') + ' on ' + on.join(' and ') : 'bases empty') + `, count ${sit.b}-${sit.s}`);
    }
    // At the plate and on the mound
    const plate = [];
    if (!A.final) {
      const bid = BB.batterOf(A.meta, sit), pid = BB.pitcherOf(A.meta, sit);
      if (bid) {
        const b = T[bat].bat[bid], t = A.seaOf(bat, bid), slot = T[bat].order.findIndex(o => o.id === bid);
        plate.push(`<span class="big">${nm(A, bat, bid)}</span> <small>${slot >= 0 ? 'Batting ' + ordinal(slot + 1) + (T[bat].order[slot].pos ? ', ' + esc(T[bat].order[slot].pos) : '') : ''}</small>`);
        plate.push(`Today: ${esc(batSentence(b))}` + (seaBat(t) ? ` <small>Season: ${esc(seaBat(t))}</small>` : ''));
      }
      const deck = BB.onDeck(A.meta, sit, 1);
      if (deck && deck !== bid) plate.push(`On deck: ${nm(A, bat, deck)} <small>${esc(BB.todayLine(T[bat].bat[deck]) || seaBat(A.seaOf(bat, deck)) || '')}</small>`);
      if (pid) {
        const q = T[fld].pit[pid], t = A.seaOf(fld, pid), np = (sit.np || {})[pid] || 0;
        plate.push(`Pitching: <b>${nm(A, fld, pid)}</b> (${esc(T[fld].name)}), <span class="${np >= 90 ? 'hot' : ''}">${np} pitches</span>` + (q ? ` <small>Today: ${esc(pitLine(q))}</small>` : '') + (seaPit(t, inn) ? ` <small>Season: ${esc(seaPit(t, inn))}</small>` : ''));
      }
    }
    // Scoring
    const scoring = A.plays.filter(p => p.runs).map(p => `<small>${esc(halfName(p.period))}</small>${tshort(A, p.side)} ${esc(p.words)}, ${plural(p.runs, 'run')} <small>${esc(T.home.name)} ${p.score ? p.score.home : ''}, ${esc(T.away.name)} ${p.score ? p.score.away : ''}</small>`);
    // Watch: milestones and things worth a mention
    const watch = [];
    for (const side of SIDES) {
      const t = T[side], opp = T[BB.other(side)];
      for (const id in t.bat) {
        const b = t.bat[id], who = nm(A, side, id) + ` (${esc(t.name)})`;
        if (b.HR >= 2) watch.push(`<span class="hot">${who} has ${b.HR} home runs</span>`);
        if (b.H >= 3) watch.push(`<span class="hot">${who} is ${b.H} for ${b.AB}</span>`);
        const kinds = ['1B', '2B', '3B', 'HR'].filter(k => b[k]).length;
        if (kinds === 3) watch.push(`<span class="hot">${who} is a ${['single', 'double', 'triple', 'home run'][['1B', '2B', '3B', 'HR'].findIndex(k => !b[k])]} away from the cycle</span>`);
        if (kinds === 4) watch.push(`<span class="hot">${who} has hit for the cycle</span>`);
        if (b.RBI >= 3) watch.push(`${who} has ${b.RBI} RBI`);
        if (b.SB >= 2) watch.push(`${who} has ${b.SB} stolen bases`);
      }
      for (const id in t.pit) {
        const q = t.pit[id], who = nm(A, side, id) + ` (${esc(t.name)})`;
        if (q.SO >= 6) watch.push(`${who} has ${q.SO} strikeouts`);
        if (q.NP >= 90 && !A.final) watch.push(`${who} is at ${q.NP} pitches`);
      }
      // A no-hitter: the other team has no hits through at least 3 innings of batting
      const battedOuts = Object.values(t.pit).reduce((n, q) => n + q.outs, 0);
      if (!opp.tot.H && battedOuts >= 9) watch.push(`<span class="hot">${esc(opp.name)} has no hits through ${BB.ip(battedOuts)} innings</span>`);
      if (t.tot.E >= 3) watch.push(`${esc(t.name)} has ${t.tot.E} errors`);
    }
    // Leaders today
    const lead = [];
    for (const side of SIDES) {
      const t = T[side], parts = [];
      for (const [k, one, many] of [['H', 'hit', 'hits'], ['RBI', 'RBI', 'RBI'], ['HR', 'HR', 'HR'], ['SB', 'SB', 'SB']]) {
        const ids = Object.keys(t.bat), top = Math.max(0, ...ids.map(id => t.bat[id][k])); if (!top) continue;
        const who = ids.filter(id => t.bat[id][k] === top);
        parts.push(`${who.length > 2 ? who.length + ' tied at' : who.map(id => esc(lastName((t.byId.get(id) || {}).name))).join('/')} ${top} ${top === 1 ? one : many}`);
      }
      if (parts.length) lead.push(`${tshort(A, side)}: ${parts.join(' · ')}`);
    }
    // Pitchers today
    const pitchers = [];
    for (const side of SIDES) for (const id in T[side].pit) { const q = T[side].pit[id]; if (q.BF || q.NP) pitchers.push(`${tshort(A, side)} ${nm(A, side, id)}: ${esc(pitLine(q))}`); }
    const pane = document.querySelector('[data-pane=talk]'), two = el('div', 'grid2');
    two.append(card('Leaders today', lead), card('Pitchers', pitchers));
    pane.replaceChildren(card('Right now', now), ...(plate.length ? [card('At the plate', plate)] : []), card('Scoring', scoring), card('Watch', watch), two,
      card('Game flow', [`${plural(A.leadChanges, 'lead change')}, ${plural(A.ties, 'tie')}`, `Left on base: ${esc(T.home.name)} ${T.home.tot.LOB}, ${esc(T.away.name)} ${T.away.tot.LOB}`]));
  };

  const renderPlayers = A => {
    const pane = document.querySelector('[data-pane=players]'), two = el('div', 'grid2'), sit = A.sit, up = A.final ? '' : BB.batterOf(A.meta, sit);
    for (const side of SIDES) {
      const t = A.T[side], c = el('div', 'card');
      c.append(html('h2', null, `${tshort(A, side)} · ${t.tot.R} R, ${t.tot.H} H`));
      // The batting order first, then anyone else who batted (pinch hitters, subs)
      const ids = [...t.order.map(o => o.id), ...Object.keys(t.bat).filter(id => !t.order.some(o => o.id === id))];
      ids.forEach((id, i) => {
        const p = t.byId.get(id); if (!p) return;
        const b = t.bat[id], sea = BB.seasonFor(t.sea, p.name), o = t.order.find(x => x.id === id);
        const d = el('div', 'pl' + (b && b.PA ? '' : ' dnp')), w = el('div', 'who'), nb = el('b', null, (i < t.order.length ? (i + 1) + '. ' : '') + (p.num ? '#' + p.num + ' ' : '') + p.name + (o && o.pos ? ' · ' + o.pos : ''));
        if (id === up && BB.batting(sit) === side) nb.append(el('span', 'tag dd', 'UP'));
        if (b && b.HR) nb.append(el('span', 'tag dd', b.HR > 1 ? b.HR + ' HR' : 'HR'));
        w.append(nb, el('span', null, b && b.PA ? b.H + '-' + b.AB : ''));
        d.append(w, el('div', 'line', lastName(p.name) + ': ' + batSentence(b)));
        d.append(el('div', 'raw', [b && b.PA ? batRaw(b) : '', sea && sea.bat.AB ? 'Season ' + seaBat(sea) : ''].filter(Boolean).join(' · ') || 'No stats yet'));
        c.append(d);
      });
      const pids = Object.keys(t.pit).filter(id => t.pit[id].BF || t.pit[id].NP);
      if (pids.length) {
        c.append(el('h2', null, 'Pitching'));
        for (const id of pids) {
          const p = t.byId.get(id) || {}, q = t.pit[id], sea = BB.seasonFor(t.sea, p.name), d = el('div', 'pl'), w = el('div', 'who');
          const nb = el('b', null, (p.num ? '#' + p.num + ' ' : '') + (p.name || '')); if (q.W) nb.append(el('span', 'tag dd', 'W')); if (q.L) nb.append(el('span', 'tag', 'L')); if (q.SV) nb.append(el('span', 'tag k', 'SV'));
          w.append(nb, el('span', null, BB.ip(q.outs))); d.append(w, el('div', 'line', pitLine(q) + '.'));
          if (seaPit(sea, A.innings)) d.append(el('div', 'raw', 'Season ' + seaPit(sea, A.innings)));
          c.append(d);
        }
      }
      if (!t.roster.length) c.append(el('p', 'raw', 'No roster entered on the stat keeper page.'));
      two.append(c);
    }
    pane.replaceChildren(two);
  };

  const renderTeam = A => {
    const pane = document.querySelector('[data-pane=team]'), { T, st, sit } = A;
    // Line score
    const n = Math.max(A.innings, st.line.away.length, st.line.home.length), lc = el('div', 'card'), wrap = el('div', 'scroll'), tbl = el('table', 'ls'), hr = el('tr');
    lc.append(el('h2', null, 'Line score'));
    hr.append(el('th', null, ''), ...Array.from({ length: n }, (_, i) => el('th', null, String(i + 1))), ...['R', 'H', 'E', 'LOB'].map(x => el('th', null, x)));
    tbl.append(hr);
    for (const side of ['away', 'home']) {
      const tr = el('tr'), t = T[side], cells = st.line[side];
      tr.append(html('td', null, tshort(A, side)));
      for (let i = 0; i < n; i++) { const td = el('td', null, cells[i] == null ? '' : String(cells[i])); if (!A.final && !A.between && sit.inn === i + 1 && BB.batting(sit) === side) td.className = 'now'; tr.append(td); }
      tr.append(el('td', 't', String(t.tot.R)), el('td', null, String(t.tot.H)), el('td', null, String(t.tot.E)), el('td', null, String(t.tot.LOB)));
      tbl.append(tr);
    }
    wrap.append(tbl); lc.append(wrap);
    // Side by side
    const sum = (o, k) => Object.values(o).reduce((s, x) => s + (x[k] || 0), 0);
    const ROWS = [['Runs', t => t.tot.R], ['Hits', t => t.tot.H], ['Home runs', t => sum(t.bat, 'HR')], ['Extra-base hits', t => sum(t.bat, '2B') + sum(t.bat, '3B') + sum(t.bat, 'HR')],
                  ['Walks', t => sum(t.bat, 'BB')], ['Strikeouts (batting)', t => sum(t.bat, 'SO')], ['Stolen bases', t => sum(t.bat, 'SB')], ['Errors', t => t.tot.E],
                  ['Left on base', t => t.tot.LOB], ['Pitches thrown', t => sum(t.pit, 'NP')], ['Strikeouts (pitching)', t => sum(t.pit, 'SO')]];
    const c = el('div', 'card'), cmp = el('table', 'cmp'), names = el('tr', 'head');
    names.append(html('td', null, tshort(A, 'home')), el('td', 'lbl vs', 'vs'), html('td', null, tshort(A, 'away')));
    cmp.append(names);
    for (const [label, fn] of ROWS) { const tr = el('tr'); tr.append(el('td', null, String(fn(T.home))), el('td', 'lbl', label), el('td', null, String(fn(T.away)))); cmp.append(tr); }
    c.append(cmp);
    pane.replaceChildren(lc, c);
  };

  const renderPlays = A => {
    const pane = document.querySelector('[data-pane=plays]'), c = el('div', 'card'), ul = el('ul', 'plays');
    c.append(el('h2', null, 'Plays, newest first'));
    for (const p of [...A.plays].reverse().slice(0, 200)) {
      const li = el('li', p.runs ? 'sc' : '');
      li.append(el('span', 'p', halfShort(p.period)), html('span', null, `<span class="dot" style="--c:${esc(A.T[p.side].color)}"></span>${esc(p.words)}${p.runs ? ' · ' + plural(p.runs, 'run') : ''}`),
                el('span', 's', p.runs && p.score ? `${A.T.home.name} ${p.score.home}–${p.score.away} ${A.T.away.name}` : ''));
      ul.append(li);
    }
    if (!ul.children.length) ul.append(el('li', null, 'No plays yet.'));
    c.append(ul); pane.replaceChildren(c);
  };

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== tab);
    render(); scrollTo(0, 0);
  });
  // Keep the phone awake while it's open.
  let wake = null;
  const keepAwake = () => { if (!wake && navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; w.onrelease = () => wake = null; }).catch(() => {}); };
  document.addEventListener('click', keepAwake, { once: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  connect(); loadSeasons();
})();
</script>
</body>
</html>

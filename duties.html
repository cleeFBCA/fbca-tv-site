<!--
  The crew duties page. Everything crew-only on it is encrypted with the crew
  password: the signups in duties-signups.json, written by tools/crew-sync.mjs
  from the signup spreadsheet, and the duty cards in duties-guide.json, written
  by tools/crew-guide.mjs. This page holds no secrets itself. It decrypts both
  files in the browser once the password is entered.
-->
<style>
  :root{
    --pine:#0D2418; --field:#17402B; --turf:#1E5638; --line:#2C6A46;
    --gold:#D9A521; --gold-hi:#F2C14E; --chalk:#F3EFE2; --chalk-dim:#B9C6B4;
    --radius:14px; --wrap:820px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Barlow',system-ui,sans-serif;
    background:radial-gradient(1200px 500px at 50% -120px, rgba(217,165,33,.10), transparent 60%), var(--pine);
    color:var(--chalk);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
  }
  a{color:var(--gold-hi)}
  :focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px;border-radius:4px}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
  [hidden]{display:none !important}

  header{
    position:sticky;top:0;z-index:50;background:rgba(13,36,24,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid rgba(217,165,33,.35);
  }
  .bar{display:flex;align-items:center;gap:12px;height:64px;max-width:var(--wrap);margin:0 auto;padding:0 16px}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--chalk)}
  .brand img{height:42px;width:auto}
  .brand-name{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:.04em;line-height:1;text-transform:uppercase}
  .brand-name small{display:block;font-family:'Barlow';font-weight:600;font-size:.6rem;letter-spacing:.26em;color:var(--gold);margin-top:3px}
  .lock-btn{margin-left:auto;font:600 .9rem 'Barlow';color:var(--chalk-dim);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
  .lock-btn:hover{color:var(--gold-hi);background:rgba(217,165,33,.08)}

  main{padding:28px 0 60px}
  h1{font-family:'Big Shoulders Display';font-weight:800;font-size:clamp(2rem,6vw,2.6rem);letter-spacing:.03em;text-transform:uppercase;line-height:1.05}
  .sub{color:var(--chalk-dim);margin-top:6px}

  /* Password screen */
  .gate{max-width:420px;margin:8vh auto 0;background:var(--field);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--radius);padding:26px 22px}
  .gate p{color:var(--chalk-dim);margin:8px 0 18px}
  .gate label.field{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  .gate input[type=password]{width:100%;font:500 1.05rem 'Barlow';padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--pine);color:var(--chalk)}
  .remember{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:.95rem;color:var(--chalk-dim)}
  .remember input{width:18px;height:18px;accent-color:var(--gold)}
  .btn{display:inline-block;font:700 1rem 'Barlow';letter-spacing:.02em;background:var(--gold);color:var(--pine);border:0;border-radius:10px;padding:12px 20px;cursor:pointer;width:100%}
  .btn:disabled{opacity:.6;cursor:wait}
  .err{color:#ff9b8a;font-weight:600;margin-top:12px;min-height:1.4em}

  /* Who am I */
  .me{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:20px 0 6px}
  .me label{font-weight:600}
  select{font:600 1rem 'Barlow';padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--chalk);max-width:100%}
  .mine{background:rgba(217,165,33,.08);border:1px solid rgba(217,165,33,.4);border-radius:12px;padding:14px 16px;margin-top:12px}
  .mine h2{font-family:'Big Shoulders Display';font-weight:800;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-hi)}
  .mine ul{list-style:none;margin-top:6px}
  .mine li{padding:6px 0;border-top:1px solid rgba(217,165,33,.2)}
  .mine li:first-child{border-top:0}
  .mine b{color:var(--chalk)}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin:22px 0 16px;border-bottom:1px solid var(--line)}
  .tabs button{font:700 1rem 'Big Shoulders Display';letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--chalk-dim);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected=true]{color:var(--gold-hi);border-bottom-color:var(--gold)}

  /* Games */
  .game{background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .game-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
  .when{font-family:'Big Shoulders Display';font-weight:800;font-size:1.05rem;letter-spacing:.06em;color:var(--gold-hi);text-transform:uppercase}
  .soon{font:700 .72rem 'Barlow';letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--pine);border-radius:999px;padding:2px 8px}
  .match{font-family:'Big Shoulders Display';font-weight:800;font-size:1.5rem;letter-spacing:.02em;line-height:1.15;width:100%}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--chalk-dim);font-size:.95rem;margin-top:4px}
  .meta b{color:var(--chalk)}
  .ha{font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--chalk-dim);border-radius:999px;padding:1px 8px;color:var(--chalk)}
  .crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:6px;margin-top:14px}
  .slot{display:flex;flex-wrap:wrap;justify-content:space-between;align-content:flex-start;gap:2px 8px;min-width:0;text-align:left;font:inherit;color:inherit;background:var(--pine);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
  .slot:hover{border-color:var(--gold)}
  .slot .pos{color:var(--chalk-dim);font-size:.88rem}
  .slot .who{font-weight:700}
  .slot .kits{width:100%;display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .slot.open .who{color:var(--chalk-dim);font-weight:500;opacity:.6}
  .slot.me-slot{background:rgba(217,165,33,.18);border-color:var(--gold)}
  .notes{margin-top:10px;font-size:.9rem;color:var(--chalk-dim)}
  .toggle{display:flex;align-items:center;gap:8px;color:var(--chalk-dim);font-size:.95rem;margin-bottom:12px}
  .toggle input{width:18px;height:18px;accent-color:var(--gold)}
  .empty{color:var(--chalk-dim);background:var(--field);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center}

  /* Duty cards */
  .duty{background:var(--field);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;scroll-margin-top:80px}
  .duty>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}
  .duty>summary::-webkit-details-marker{display:none}
  .duty>summary::after{content:'+';margin-left:auto;font:700 1.4rem 'Barlow';color:var(--gold)}
  .duty[open]>summary::after{content:'–'}
  .duty>summary h2{font-family:'Big Shoulders Display';font-weight:800;font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase}
  .duty .body{padding:0 16px 16px}
  .duty .body>p:first-child{color:var(--chalk-dim)}
  .md h3{font-family:'Big Shoulders Display';font-weight:800;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-hi);margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
  .md p{margin:8px 0}
  .md ul,.md ol{margin:6px 0 6px 22px}
  .md li{margin:5px 0}
  .md ul.checks{list-style:none;margin-left:0}
  .md ul.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .md ul.checks input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--gold)}
  .md ul.checks input:checked+span{color:var(--chalk-dim);text-decoration:line-through}
  .md code{background:var(--pine);padding:1px 5px;border-radius:4px}
  .clear{font:600 .85rem 'Barlow';color:var(--chalk-dim);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;margin-top:12px}
  .clear:hover{color:var(--gold-hi);border-color:var(--gold)}
  .also{font-size:.92rem;color:var(--chalk-dim);margin-top:12px}
  .kit{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;white-space:nowrap}
  .kit i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(243,239,226,.55);flex:none}
  .slot .kit{font-size:.8rem;color:var(--chalk-dim);font-weight:600;white-space:normal;align-items:flex-start;overflow-wrap:anywhere}
  .slot .kit i{margin-top:2px}
  .mine .kit{margin-right:4px}
  .kitpanel{background:rgba(217,165,33,.08);border:1px solid rgba(217,165,33,.4);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .kitpanel h2{font-family:'Big Shoulders Display';font-weight:800;font-size:1.3rem;letter-spacing:.03em;text-transform:uppercase}
  .kitpanel .sub{margin:2px 0 6px;font-size:.92rem}
  .kitpanel h3{display:flex;align-items:center;gap:8px}
  .kitpanel h3 .kit{font-size:1.05rem;color:var(--chalk)}
  .kitpanel h3 .sec{font:600 .8rem 'Barlow';letter-spacing:.04em;text-transform:none;color:var(--chalk-dim)}
  .inv h3{margin-top:22px}
  .inv .duty>summary{padding:12px 16px}
  .inv .duty>summary .kit{font-size:1.05rem}
  .inv dl{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:6px 12px;font-size:.95rem}
  .inv dt{color:var(--chalk-dim)}
  .out{background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .out ul{list-style:none;margin:8px 0 0}
  .out li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
  .out li:first-child{border-top:0}
  .out .rest{color:var(--chalk-dim);font-size:.9rem;margin-top:8px}
  .setup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;color:var(--chalk-dim);font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{font:700 .95rem 'Barlow';background:var(--pine);color:var(--chalk-dim);border:0;padding:8px 18px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--gold);color:var(--pine)}
  .setup .hint{font-weight:500;font-size:.9rem}

  footer{border-top:1px solid rgba(217,165,33,.3);padding:20px 0 36px;color:var(--chalk-dim);font-size:.88rem}

  @media (max-width:640px){
    .brand-name{font-size:1.05rem}
    .crew{grid-template-columns:repeat(2,minmax(0,1fr))}
    .slot{flex-direction:column;justify-content:flex-start;gap:0}
  }
</style>
</head>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, where = localStorage) { try { return where.getItem(k); } catch { return null; } },
    set(k, v, where = localStorage) { try { v == null ? where.removeItem(k) : where.setItem(k, v); } catch {} },
  };
  const PW_KEY = 'eota-duties-pw';

  // --- Decrypting (matches tools/crew-crypto.mjs) ----------------------------

  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function openEnvelope(env, password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(env.salt), iterations: env.iter }, base, 512);
    const key = await crypto.subtle.importKey('raw', new Uint8Array(bits).slice(0, 32), 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct));
    return new TextDecoder().decode(pt);
  }
  const fetchJSON = (path) => fetch(path, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); });

  async function unlock(password) {
    const [signupsEnv, guideEnv] = await Promise.all([fetchJSON('/duties-signups.json'), fetchJSON('/duties-guide.json')]);
    let signups, guide;
    try {
      [signups, guide] = await Promise.all([openEnvelope(signupsEnv, password), openEnvelope(guideEnv, password)]);
    } catch (e) {
      const wrong = new Error('wrong'); wrong.wrong = true; throw wrong;
    }
    const parsed = JSON.parse(signups);
    return { games: parsed.games, equipment: parsed.equipment, guide, updated: signupsEnv.updated };
  }

  // --- The guide: a small Markdown subset ------------------------------------

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^)\s]*)\)/g, '<a href="$2">$1</a>');
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '');

  // A heading ending in "(Home)" or "(Away)" is only for that setup. Untagged is for both.
  function tagged(heading) {
    const m = heading.trim().match(/^(.*?)\s*\((home|away)\)$/i);
    return m ? { text: m[1], tag: m[2].toLowerCase() } : { text: heading.trim(), tag: null };
  }

  /** Splits the guide into its "# " sections: [{ title, id, tag, lines }]. */
  function sections(md) {
    const out = [];
    for (const line of md.split(/\r?\n/)) {
      const h = line.match(/^#\s+(.+)/);
      // "Scorebug Op" is the Scorebug column's card: a trailing "Op" isn't part of the position's name.
      if (h) { const t = tagged(h[1]); out.push({ title: t.text, id: slug(t.text.replace(/\s+op(erator)?\.?$/i, '')), tag: t.tag, lines: [] }); }
      else if (out.length) out[out.length - 1].lines.push(line);
    }
    return out;
  }

  /** The guide's sections for one setup, in order: a "(Home)" or "(Away)" version replaces the untagged one. */
  function forMode(secs, mode) {
    const picked = new Map();
    for (const s of secs) {
      if (s.tag && s.tag !== mode) continue;
      if (!picked.has(s.id) || s.tag) picked.set(s.id, s);
    }
    return [...picked.values()];
  }

  // A line ending in "{Baseball, Softball}" is only for those sports. With no game
  // picked, it shows with a label instead.
  function sportTag(text) {
    const m = text.match(/^(.*?)\s*\{([^}]+)\}\s*$/);
    if (!m) return { text, show: true };
    const sports = m[2].split(/\s*,\s*/).filter(Boolean);
    if (!state.sport) return { text: `**${sports.join(', ')} only:** ${m[1]}`, show: true };
    return { text: m[1], show: sports.some((sp) => state.sport.toLowerCase().includes(sp.toLowerCase())) };
  }

  /** Renders a section's lines for one setup. Checkboxes remember their state under `key`. */
  function render(lines, key, mode) {
    let html = '', list = null, para = [], n = 0, skip = false;
    key = `${key}:${mode}`;
    const endPara = () => { if (para.length) html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; };
    const endList = () => { if (list) html += `</${list}>`; list = null; };
    const open = (tag, cls) => { if (list !== tag + (cls || '')) { endList(); html += `<${tag}${cls ? ` class="${cls}"` : ''}>`; list = tag + (cls || ''); } };
    for (const raw of lines) {
      const line = raw.trimEnd();
      let m;
      if ((m = line.match(/^##+\s+(.+)/))) {
        endPara(); endList();
        const t = tagged(m[1]);
        skip = t.tag && t.tag !== mode;
        if (!skip) html += '<h3>' + inline(t.text) + '</h3>';
      }
      else if (skip) continue;
      else if (!line.trim()) { endPara(); endList(); }
      else if ((m = line.match(/^\s*[-*]\s+\[( |x)\]\s+(.+)/i))) {
        // Count every checkbox, shown or not, so each keeps its saved state.
        const id = `${key}:${n++}`, t = sportTag(m[2]);
        if (!t.show) continue;
        endPara(); open('ul', 'checks');
        const checked = store.get('eota-duties-check:' + id) === '1';
        html += `<li><label><input type="checkbox" data-check="${esc(id)}"${checked ? ' checked' : ''}><span>${inline(t.text)}</span></label></li>`;
      }
      else if ((m = line.match(/^\s*[-*]\s+(.+)/))) { const t = sportTag(m[1]); if (t.show) { endPara(); open('ul'); html += '<li>' + inline(t.text) + '</li>'; } }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.+)/))) { const t = sportTag(m[1]); if (t.show) { endPara(); open('ol'); html += '<li>' + inline(t.text) + '</li>'; } }
      else { endList(); para.push(line.trim()); }
    }
    endPara(); endList();
    return { html, checks: n };
  }

  // --- Positions to duty cards ------------------------------------------------

  // Column names that differ between the sheet's tabs.
  const ALIAS = { techdir: 'techdirector', social: 'socialmedia' };
  const posId = (name) => { const s = slug(name); return ALIAS[s] || s; };
  /** The duty cards for a position: its own card, then its group's (Cam 2 → Camera). */
  function cardsFor(position, byId) {
    const id = posId(position), ids = [];
    if (byId[id]) ids.push(id);
    const group = /^cam\d*$/.test(id) || /^camera\d*$/.test(id) ? 'camera' : /^utility\d*$/.test(id) ? 'utility' : null;
    if (group && byId[group] && group !== id) ids.push(group);
    return ids;
  }

  // --- Kits (from the Equipment and Assignments tabs) --------------------------

  const KIT_COLORS = { maroon: '#7a1f2b', gold: '#d9a521', green: '#2e8b57', white: '#f3efe2', black: '#111', silver: '#c0c0c0',
    gray: '#8a8a8a', grey: '#8a8a8a', red: '#c0392b', blue: '#2f6fd6', navy: '#1f3a7a', orange: '#e67e22', purple: '#7d3c98', yellow: '#f1c40f' };
  function kitColor(name) {
    const word = name.toLowerCase().split(/\s+/)[0];
    if (KIT_COLORS[word]) return KIT_COLORS[word];
    try { if (CSS.supports('color', word)) return word; } catch {}
    return 'transparent';
  }
  const chip = (name) => `<span class="kit"><i style="background:${kitColor(name)}"></i>${esc(name)}</span>`;

  /**
   * What a cell on the Assignments tab names, one thing per comma: kits from the Equipment tab, by
   * the box's name ("Audio Bag") or its section's ("Announcer Kit", which brings
   * every box in that section); single items out of a box, by the item ("Ecoflow
   * River 2") or its column ("Tripod 1"), when only one item has that name; and
   * anything else as written. Each item stays separate, like each battery.
   */
  function kitsIn(text) {
    if (!text) return [];
    const out = [];
    for (const part of text.split(/\s*,\s*/).filter(Boolean)) {
      const key = part.toLowerCase();
      if (state.kitByName[key]) { out.push(state.kitByName[key]); continue; }
      if (state.kitsBySection[key]) { out.push(...state.kitsBySection[key]); continue; }
      const hit = state.itemIndex[key];
      if (hit && hit.length === 1) {
        const { kit, i } = hit[0];
        out.push({ ...kit, items: [kit.items[i]], picked: [i], labels: [part], partial: true });
        continue;
      }
      out.push({ name: part, extra: true });
    }
    return out;
  }
  /** How an assignment shows on a game: the kit's name, or the items picked from it. */
  const kitLabel = (k) => (k.partial ? k.labels.join(', ') : k.name);
  /** A kit's items as checklist text: "Camera: Canon XA25", or just "Sled" when the part and item match. */
  const itemText = ([part, item]) => (item.toLowerCase() === part.toLowerCase() || !part ? item : `${part}: ${item}`);

  // --- Dates ------------------------------------------------------------------

  const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const localISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function when(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const now = new Date(), tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const tag = iso === localISO(now) ? 'Today' : iso === localISO(tomorrow) ? 'Tomorrow' : '';
    return { text: `${DAYS[date.getDay()]}, ${MONTHS[m - 1]} ${d}`, tag };
  }

  // --- The page ---------------------------------------------------------------

  let state = null;

  function show(data) {
    const secs = sections(data.guide);
    // Hide games already over (the sync drops them daily; this covers the gap).
    const today = localISO(new Date());
    const games = data.games.filter((g) => g.date >= today);
    // Start on the setup the next game needs.
    state = { ...data, games, secs, mode: modeOf(games[0]), equipment: data.equipment || [], kitByName: {} };
    state.kitsBySection = {};
    state.itemIndex = {}; // an item's name or its column's name → every { kit, i } it could mean
    for (const sec of state.equipment) {
      const kits = sec.kits.map((k) => ({ ...k, section: sec.title }));
      kits.forEach((k) => {
        state.kitByName[k.name.toLowerCase()] = k;
        k.items.forEach(([part, item], i) => {
          for (const name of new Set([part.toLowerCase(), item.toLowerCase()].filter(Boolean))) (state.itemIndex[name] ??= []).push({ kit: k, i });
        });
      });
      state.kitsBySection[sec.title.toLowerCase()] = kits;
    }

    $('gate').hidden = true;
    $('app').hidden = false;
    $('lock').hidden = false;

    // Everyone signed up for an upcoming game.
    const names = [...new Set(games.flatMap((g) => g.crew.map((c) => c[1]).filter(Boolean)))].sort((a, b) => a.localeCompare(b));
    const who = $('who');
    who.innerHTML = '<option value="">Choose your name…</option>' + names.map((n) => `<option>${esc(n)}</option>`).join('');
    const saved = store.get('eota-duties-me');
    if (saved && names.includes(saved)) who.value = saved;

    $('showOpen').checked = store.get('eota-duties-open') === '1';

    setMode(state.mode);
    renderGames();

    if (data.updated) {
      const d = new Date(data.updated);
      $('synced').textContent = `Signups last changed ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} at ${d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}. The page checks the sheet every 15 minutes.`;
    }
  }

  function renderGames() {
    const me = $('who').value, showOpen = $('showOpen').checked;
    const box = $('games');
    if (!state.games.length) {
      box.innerHTML = '<div class="empty">No upcoming games on the signup sheet yet.</div>';
    } else {
      box.innerHTML = state.games.map((g, gi) => {
        const w = when(g.date);
        const slots = g.crew.filter((c) => c[1] || c[2] || showOpen).map(([pos, name, kit]) => {
          const cls = ['slot', name ? '' : 'open', me && name === me ? 'me-slot' : ''].filter(Boolean).join(' ');
          const kits = kitsIn(kit).map((k) => chip(kitLabel(k))).join(' ');
          return `<button class="${cls}" data-pos="${esc(pos)}" data-mode-of="${modeOf(g)}" data-game="${gi}"><span class="pos">${esc(pos)}</span><span class="who">${name ? esc(name) : 'Open'}</span>${kits ? `<span class="kits">${kits}</span>` : ''}</button>`;
        }).join('');
        return `<article class="game">
          <div class="game-head">
            <span class="when">${w.text}</span>${w.tag ? `<span class="soon">${w.tag}</span>` : ''}
            <div class="match">${esc(g.sport)} ${g.ha.toLowerCase() === 'away' ? 'at' : 'vs.'} ${esc(g.opponent)}</div>
          </div>
          <div class="meta">
            ${g.ha ? `<span class="ha">${esc(g.ha)}</span>` : ''}
            ${g.call ? `<span>Call <b>${esc(g.call)}</b></span>` : ''}
            ${g.game ? `<span>Game <b>${esc(g.game)}</b></span>` : ''}
            ${g.show ? `<span>Show #${esc(g.show)}</span>` : ''}
          </div>
          ${slots ? `<div class="crew">${slots}</div>` : `<p class="notes">No one has signed up yet. ${g.crew.length} positions open.</p>`}
          ${g.notes.length ? `<div class="notes">Also on the sheet: ${g.notes.map(esc).join(', ')}</div>` : ''}
        </article>`;
      }).join('');
    }
    renderMine();
  }

  function renderMine() {
    const me = $('who').value, box = $('mine');
    store.set('eota-duties-me', me || null);
    if (!me) { box.hidden = true; return; }
    const jobs = state.games.flatMap((g, gi) => g.crew.filter((c) => c[1] === me).map((c) => ({ g, gi, pos: c[0], kit: c[2] })));
    box.hidden = false;
    box.innerHTML = `<h2>${esc(me)}’s games</h2>` + (jobs.length
      ? '<ul>' + jobs.map(({ g, gi, pos, kit }) => {
          const w = when(g.date);
          const kits = kitsIn(kit).map((k) => chip(kitLabel(k))).join(', ');
          return `<li><b>${w.tag || w.text}</b> · ${esc(g.sport)} ${g.ha.toLowerCase() === 'away' ? 'at' : 'vs.'} ${esc(g.opponent)} · <a href="#" data-pos="${esc(pos)}" data-mode-of="${modeOf(g)}" data-game="${gi}">${esc(pos)}</a>${kits ? ' · ' + kits : ''}${g.call ? ` · call ${esc(g.call)}` : ''}</li>`;
        }).join('') + '</ul>'
      : '<p>You’re not signed up for any upcoming games.</p>');
  }

  const modeOf = (g) => (g && /away/i.test(g.ha) ? 'away' : 'home');

  /** Switches the duty cards and equipment list to the home or away setup. */
  function setMode(mode) {
    state.mode = mode;
    const byId = {};
    forMode(state.secs, mode).forEach((s) => { byId[s.id] = s; });
    state.byId = byId;
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    const next = state.games.find((g) => modeOf(g) === mode);
    $('setupHint').textContent = state.sport ? `Showing steps for ${state.sport}` : next ? `Next ${mode} game: ${when(next.date).tag || when(next.date).text}` : '';
    // Keep the same cards open across the switch.
    const open = [...document.querySelectorAll('.duty[open]')].map((d) => d.id);
    renderDuties();
    renderEquipment();
    open.forEach((id) => { const d = $(id); if (d) d.open = true; });
  }

  function renderDuties() {
    const cards = Object.values(state.byId).filter((s) => s.id !== 'equipmentlist');
    $('duties').innerHTML = cards.map((s) => {
      const { html, checks } = render(s.lines, s.id, state.mode);
      return `<details class="duty" id="duty-${s.id}"><summary><h2>${esc(s.title)}</h2></summary>
        <div class="body md">${html}${checks ? `<button class="clear" data-clear="${s.id}">Clear checkmarks</button>` : ''}</div></details>`;
    }).join('') || '<div class="empty">No duty cards yet.</div>';
  }

  function renderEquipment() {
    let html = '';
    // Which kit goes to which position at each upcoming game.
    for (const g of state.games) {
      const out = g.crew.flatMap(([pos, who, kit]) => kitsIn(kit).map((k) => ({ k, pos, who })));
      if (!out.length) continue;
      const w = when(g.date);
      // What stays behind: whole boxes nobody has, and the items left in boxes only partly taken.
      const whole = new Set(out.filter((o) => !o.k.partial && !o.k.extra).map((o) => o.k.name));
      const picked = {};
      out.filter((o) => o.k.partial).forEach((o) => o.k.picked.forEach((i) => (picked[o.k.name] ??= new Set()).add(i)));
      const rest = state.equipment.flatMap((sec) => sec.kits).filter((k) => !whole.has(k.name)).map((k) => {
        if (!picked[k.name]) return esc(k.name);
        const left = k.items.filter((_, i) => !picked[k.name].has(i)).map(itemText);
        return left.length ? `${esc(k.name)} (${left.map(esc).join(', ')})` : '';
      }).filter(Boolean);
      html += `<div class="out"><span class="when">${w.tag || w.text}</span> · ${esc(g.sport)} ${g.ha.toLowerCase() === 'away' ? 'at' : 'vs.'} ${esc(g.opponent)}
        <ul>${out.map(({ k, pos, who }) => `<li>${chip(kitLabel(k))} <span>${esc(pos)}${who ? ` · ${esc(who)}` : ''}</span></li>`).join('')}</ul>
        ${rest.length ? `<div class="rest">Not assigned: ${rest.join(', ')}</div>` : ''}</div>`;
    }
    // Every kit on the Equipment tab.
    html += state.equipment.map((sec) => `<div class="inv"><h3 class="md-h">${esc(sec.title)}</h3>` + sec.kits.map((k) =>
      `<details class="duty"><summary>${chip(k.name)}</summary><div class="body"><dl>${k.items.map(([part, item]) => `<dt>${esc(part)}</dt><dd>${esc(item)}</dd>`).join('')}</dl></div></details>`).join('') + '</div>').join('');
    // Anything else in the guide's "# Equipment list".
    const s = state.byId.equipmentlist;
    if (s) {
      const r = render(s.lines, s.id, state.mode);
      html += `<div class="md">${r.html}</div>${r.checks ? `<button class="clear" data-clear="${s.id}">Clear checkmarks</button>` : ''}`;
    }
    $('tab-equipment').innerHTML = html || '<div class="empty">No equipment list yet.</div>';
  }

  /** The kit checklist for one position at one game, shown above its duty cards. */
  function renderKitPanel(position, gi) {
    const g = state.games[gi], box = $('kitpanel');
    const entry = g && g.crew.find((c) => c[0] === position);
    if (!entry) { box.innerHTML = ''; return; }
    const [, who, kit] = entry, w = when(g.date), kits = [];
    // Items picked from the same box go under that box's heading.
    for (const k of kitsIn(kit)) {
      const same = k.partial && kits.find((o) => o.partial && o.name === k.name);
      if (same) same.items = [...same.items, ...k.items];
      else kits.push(k);
    }
    const key = `kit:${g.date}:${slug(g.sport)}:${slug(position)}`;
    let n = 0;
    const item = (text) => {
      const id = `${key}:${n++}`, checked = store.get('eota-duties-check:' + id) === '1';
      return `<li><label><input type="checkbox" data-check="${esc(id)}"${checked ? ' checked' : ''}><span>${esc(text)}</span></label></li>`;
    };
    const body = kits.length
      ? kits.map((k) => k.extra
          ? `<ul class="checks">${item(k.name)}</ul>`
          : `<h3>${chip(k.name)}${k.section && k.section.toLowerCase() !== k.name.toLowerCase() ? `<span class="sec">${esc(k.section)}</span>` : ''}</h3><ul class="checks">${k.items.map((it) => item(itemText(it))).join('')}</ul>`).join('')
      : '<p>No equipment assigned yet for this game.</p>';
    box.innerHTML = `<div class="kitpanel md"><h2>${esc(position)}${who ? ` · ${esc(who)}` : ''}</h2>
      <p class="sub">${w.tag || w.text} · ${esc(g.sport)} ${g.ha.toLowerCase() === 'away' ? 'at' : 'vs.'} ${esc(g.opponent)}${g.call ? ` · call ${esc(g.call)}` : ''}</p>
      ${body}${n ? '<button class="clear" data-clear>Clear checkmarks</button>' : ''}</div>`;
  }

  function tab(name) {
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
    ['games', 'duties', 'equipment'].forEach((t) => { $('tab-' + t).hidden = t !== name; });
    $('setup').hidden = name === 'games' || (name === 'equipment' && !state.byId.equipmentlist);
  }

  /** Opens the duty cards for a position from a game or "my games". */
  function openDuty(position, mode, gi) {
    const g = gi == null ? null : state.games[+gi];
    state.sport = g ? g.sport : null;
    setMode(mode || state.mode);
    const ids = cardsFor(position, state.byId);
    renderKitPanel(position, gi == null ? -1 : +gi);
    tab('duties');
    document.querySelectorAll('.duty').forEach((d) => { d.open = ids.includes(d.id.slice(5)); });
    const first = $('kitpanel').firstChild || (ids.length && $('duty-' + ids[0]));
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else $('tab-duties').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // --- Events -----------------------------------------------------------------

  $('gate').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value;
    $('unlock').disabled = true; $('unlock').textContent = 'Unlocking…'; $('err').textContent = '';
    try {
      const data = await unlock(pw);
      if ($('remember').checked) store.set(PW_KEY, pw); else store.set(PW_KEY, pw, sessionStorage);
      show(data);
    } catch (err) {
      $('err').textContent = err.wrong ? 'That password isn’t right.' : 'Couldn’t load the crew page. Check your connection and try again.';
    } finally {
      $('unlock').disabled = false; $('unlock').textContent = 'Unlock';
    }
  });

  $('lock').addEventListener('click', () => {
    store.set(PW_KEY, null); store.set(PW_KEY, null, sessionStorage);
    location.reload();
  });

  $('who').addEventListener('change', renderGames);
  $('showOpen').addEventListener('change', () => { store.set('eota-duties-open', $('showOpen').checked ? '1' : null); renderGames(); });
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.tab === 'duties' && (state.sport || $('kitpanel').innerHTML)) {
      $('kitpanel').innerHTML = '';
      state.sport = null;
      setMode(state.mode);
    }
    tab(b.dataset.tab);
  });

  document.addEventListener('click', (e) => {
    const pos = e.target.closest('[data-pos]');
    if (pos) { e.preventDefault(); openDuty(pos.dataset.pos, pos.dataset.modeOf, pos.dataset.game); return; }
    const mode = e.target.closest('[data-mode]');
    if (mode) { setMode(mode.dataset.mode); return; }
    const clear = e.target.closest('[data-clear]');
    if (clear) {
      clear.parentElement.querySelectorAll('[data-check]').forEach((c) => { c.checked = false; store.set('eota-duties-check:' + c.dataset.check, null); });
    }
  });
  document.addEventListener('change', (e) => {
    const c = e.target.closest('[data-check]');
    if (c) store.set('eota-duties-check:' + c.dataset.check, c.checked ? '1' : null);
  });

  // Unlock straight away with a remembered password.
  const remembered = store.get(PW_KEY) || store.get(PW_KEY, sessionStorage);
  if (remembered) {
    $('gate').hidden = true;
    unlock(remembered).then(show).catch((err) => {
      // Forget a password that no longer works. On a network error, keep it and show the error.
      if (err.wrong) { store.set(PW_KEY, null); store.set(PW_KEY, null, sessionStorage); }
      else $('err').textContent = 'Couldn’t load the crew page. Check your connection and try again.';
      $('gate').hidden = false;
    });
  }
})();
</script>

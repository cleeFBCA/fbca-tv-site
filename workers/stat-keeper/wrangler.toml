name = "eota-stat-keeper"
main = "worker.js"
compatibility_date = "2025-06-01"
# Served at eota-stat-keeper.<account>.workers.dev; fbca.tv's DNS isn't on Cloudflare.
workers_dev = true
preview_urls = false

# One Durable Object per game holds the plays in order (SQLite storage, free plan).
[[durable_objects.bindings]]
name = "GAME"
class_name = "Game"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Game"]

# Keep a log of each request (free): Worker → Logs.
[observability]
enabled = true

# Lock Screen scores (the iOS app's live game banner): phones' push-to-start tokens, one object for every sport.
[[durable_objects.bindings]]
name = "PUSH"
class_name = "Push"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Push"]

# Apple push settings (README "Lock Screen scores"). APNS_KEY (the .p8) is a secret: npx wrangler secret put APNS_KEY
# APNS_CHANNELS is filled in after running scripts/apns-channels.mjs.
[vars]
APNS_TEAM_ID = "F9A6UW5W67"
APNS_BUNDLE = "tv.fbca.eaglesontheair"
APNS_KEY_ID = ""
APNS_CHANNELS = "{}"
